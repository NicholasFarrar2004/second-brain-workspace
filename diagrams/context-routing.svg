<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title description">
  <title id="title">Select one branch, then its explicit references</title>
  <desc id="description">Illustrative architecture for a fictional starter workspace. The explicit poster-display route selects root context, Exhibit Projects area and Poster Display project, plus display-checklist.md and captions.md. The unrelated workshop-kit route is excluded. Rules, facts, current state and references have distinct ownership.</desc>
  <rect width="1000" height="900" fill="#f3f6fa" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#13283d">
    <text x="40" y="40" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">ILLUSTRATIVE ARCHITECTURE · FICTIONAL STARTER WORKSPACE</text>
    <text x="40" y="87" font-size="34" fill="#13283d" font-weight="400" font-family="Georgia, Times New Roman, serif">One route. Scoped context. Clear ownership.</text>
    <text x="60" y="152" font-size="24" fill="#13283d" font-weight="700" font-family="Menlo, Consolas, monospace">poster-display</text>
    <text x="290" y="152" font-size="22" fill="#344b60" font-weight="400">Explicit route declared in workspace.json</text>
    <text x="60" y="239" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">ROOT</text>
    <text x="60" y="272" font-size="26" fill="#13283d" font-weight="700">Common context</text>
    <text x="60" y="304" font-size="20" fill="#344b60" font-weight="400">Shared instructions and workspace facts.</text>
    <text x="60" y="332" font-size="20" fill="#344b60" font-weight="400">Begin here; do not load every project.</text>
    <path d="M310 346 V378 m-7 -8 l7 8 7 -8" fill="none" stroke="#126a73" stroke-width="1.5" />
    <text x="60" y="414" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">AREA</text>
    <text x="60" y="447" font-size="26" fill="#13283d" font-weight="700">Exhibit Projects</text>
    <text x="60" y="479" font-size="20" fill="#344b60" font-weight="400">Add the chosen area’s instructions and facts.</text>
    <text x="60" y="507" font-size="20" fill="#344b60" font-weight="400">Keep area knowledge at this scope.</text>
    <path d="M310 521 V553 m-7 -8 l7 8 7 -8" fill="none" stroke="#126a73" stroke-width="1.5" />
    <text x="60" y="589" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">PROJECT OWNER</text>
    <text x="60" y="622" font-size="26" fill="#13283d" font-weight="700">Poster Display</text>
    <text x="60" y="654" font-size="20" fill="#344b60" font-weight="400">Areas/Exhibit Projects/Poster Display</text>
    <text x="60" y="682" font-size="20" fill="#344b60" font-weight="400">Project rules + durable facts + current handoff.</text>
    <text x="60" y="710" font-size="20" fill="#344b60" font-weight="400">Read what is needed to resume this task.</text>
    <path d="M582 638 H631 m-8 -7 l8 7 -8 7" fill="none" stroke="#126a73" stroke-width="1.5" />
    <text x="660" y="589" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">EXPLICIT REFERENCES</text>
    <text x="660" y="622" font-size="26" fill="#13283d" font-weight="700">Checklist + drafts</text>
    <text x="660" y="654" font-size="20" fill="#13283d" font-weight="400" font-family="Menlo, Consolas, monospace">display-checklist.md</text>
    <text x="660" y="682" font-size="20" fill="#13283d" font-weight="400" font-family="Menlo, Consolas, monospace">captions.md</text>
    <text x="660" y="710" font-size="20" fill="#344b60" font-weight="400">Detail selected for this task.</text>
    <text x="660" y="415" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">NOT SELECTED</text>
    <text x="660" y="450" font-size="26" fill="#13283d" font-weight="700" font-family="Menlo, Consolas, monospace">workshop-kit</text>
    <text x="660" y="483" font-size="20" fill="#344b60" font-weight="400">Unrelated branch stays out.</text>
    <path d="M582 275 H800 V375" fill="none" stroke="#7d8fa1" stroke-width="1.5" stroke-dasharray="6 5" />
    <text x="649" y="252" font-size="18" fill="#344b60" font-weight="400">Shared root, separate route</text>
    <path d="M792 357 l16 16 m0 -16 l-16 16" fill="none" stroke="#7d8fa1" stroke-width="1.5" stroke-dasharray="6 5" />
    <text x="40" y="775" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">EACH RECORD HAS ONE JOB</text>
    <text x="40" y="814" font-size="24" fill="#13283d" font-weight="700">Rules</text>
    <text x="40" y="845" font-size="20" fill="#344b60" font-weight="400">How to work</text>
    <text x="280" y="814" font-size="24" fill="#13283d" font-weight="700">Facts</text>
    <text x="280" y="845" font-size="20" fill="#344b60" font-weight="400">What is known</text>
    <text x="520" y="814" font-size="24" fill="#13283d" font-weight="700">Current state</text>
    <text x="520" y="845" font-size="20" fill="#344b60" font-weight="400">Where to resume</text>
    <text x="760" y="814" font-size="24" fill="#13283d" font-weight="700">References</text>
    <text x="760" y="845" font-size="20" fill="#344b60" font-weight="400">Supporting detail</text>
    <text x="40" y="883" font-size="18" fill="#344b60" font-weight="400">A declared file-reading boundary, not automatic agent integration.</text>
    <line x1="40.0" y1="115.0" x2="960.0" y2="115.0" stroke="#13283d" stroke-width="2" />
    <line x1="40.0" y1="174.0" x2="960.0" y2="174.0" stroke="#13283d" stroke-width="1" />
    <line x1="40.0" y1="210.0" x2="580.0" y2="210.0" stroke="#a5b3c1" stroke-width="1" />
    <line x1="40.0" y1="210.0" x2="40.0" y2="342.0" stroke="#126a73" stroke-width="2" />
    <line x1="40.0" y1="385.0" x2="580.0" y2="385.0" stroke="#a5b3c1" stroke-width="1" />
    <line x1="40.0" y1="385.0" x2="40.0" y2="517.0" stroke="#126a73" stroke-width="2" />
    <line x1="40.0" y1="560.0" x2="580.0" y2="560.0" stroke="#a5b3c1" stroke-width="1" />
    <line x1="40.0" y1="560.0" x2="40.0" y2="736.0" stroke="#126a73" stroke-width="2" />
    <line x1="640.0" y1="560.0" x2="960.0" y2="560.0" stroke="#126a73" stroke-width="2" />
    <line x1="640.0" y1="565.0" x2="960.0" y2="565.0" stroke="#126a73" stroke-width="0.6" />
    <line x1="640.0" y1="385.0" x2="960.0" y2="385.0" stroke="#8090a1" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="640.0" y1="385.0" x2="640.0" y2="517.0" stroke="#8090a1" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="40" y1="790" x2="225" y2="790" stroke="#13283d" stroke-width="1" />
    <line x1="280" y1="790" x2="465" y2="790" stroke="#13283d" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="520" y1="790" x2="705" y2="790" stroke="#13283d" stroke-width="2" />
    <line x1="760" y1="790" x2="945" y2="790" stroke="#13283d" stroke-width="1" stroke-dasharray="1 3" />
    <line x1="25" y1="210" x2="25" y2="735" stroke="#b0becb" stroke-width="1" />
    <line x1="25" y1="210" x2="40" y2="210" stroke="#126a73" stroke-width="1.5" />
    <line x1="25" y1="385" x2="40" y2="385" stroke="#126a73" stroke-width="1.5" />
    <line x1="25" y1="560" x2="40" y2="560" stroke="#126a73" stroke-width="1.5" />
    <line x1="40" y1="54" x2="960" y2="54" stroke="#c8d3dd" stroke-width="1" />
  </g>
</svg>
