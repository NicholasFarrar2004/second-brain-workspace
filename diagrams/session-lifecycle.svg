<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title description">
  <title id="title">Work, checkpoint and resume</title>
  <desc id="description">Illustrative architecture for a fictional starter workspace. Request then route then read then work. Checkpoint current state in the canonical handoff, and changed durable facts in owning memory. A fresh session resumes from the checkpoint. Archive is historical evidence, not current state.</desc>
  <rect width="1000" height="1000" fill="#f3f6fa" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#13283d">
    <text x="40" y="40" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">ILLUSTRATIVE ARCHITECTURE · FICTIONAL STARTER WORKSPACE</text>
    <text x="40" y="87" font-size="35" fill="#13283d" font-weight="400" font-family="Georgia, Times New Roman, serif">Make the next session ready to continue.</text>
    <text x="40" y="126" font-size="22" fill="#344b60" font-weight="400">A documented workflow; each checkpoint leaves a usable starting point.</text>
    <text x="60" y="204" font-size="17" fill="#126a73" font-weight="700" font-family="Menlo, Consolas, monospace" letter-spacing="0">1  REQUEST</text>
    <text x="60" y="237" font-size="26" fill="#13283d" font-weight="700">Define the work</text>
    <text x="60" y="269" font-size="20" fill="#344b60" font-weight="400">State the task and its constraints.</text>
    <text x="60" y="297" font-size="20" fill="#344b60" font-weight="400">Separate the outcome from assumptions.</text>
    <text x="550" y="204" font-size="17" fill="#126a73" font-weight="700" font-family="Menlo, Consolas, monospace" letter-spacing="0">2  ROUTE</text>
    <text x="550" y="237" font-size="26" fill="#13283d" font-weight="700">Choose the owning project</text>
    <text x="550" y="269" font-size="20" fill="#344b60" font-weight="400">Follow an explicit route.</text>
    <text x="550" y="297" font-size="20" fill="#344b60" font-weight="400">Identify the applicable scope.</text>
    <path d="M475 240 H524 m-8 -7 l8 7 -8 7" fill="none" stroke="#126a73" stroke-width="1.5" />
    <path d="M745 311 V347 m-7 -8 l7 8 7 -8" fill="none" stroke="#126a73" stroke-width="1.5" />
    <text x="550" y="384" font-size="17" fill="#126a73" font-weight="700" font-family="Menlo, Consolas, monospace" letter-spacing="0">3  READ</text>
    <text x="550" y="417" font-size="26" fill="#13283d" font-weight="700">Rules + facts + current state</text>
    <text x="550" y="449" font-size="20" fill="#344b60" font-weight="400">Read root, area and project context.</text>
    <text x="550" y="477" font-size="20" fill="#344b60" font-weight="400">Include the selected references.</text>
    <text x="60" y="384" font-size="17" fill="#126a73" font-weight="700" font-family="Menlo, Consolas, monospace" letter-spacing="0">4  WORK</text>
    <text x="60" y="417" font-size="26" fill="#13283d" font-weight="700">Act and verify</text>
    <text x="60" y="449" font-size="20" fill="#344b60" font-weight="400">Work on the request using that context.</text>
    <text x="60" y="477" font-size="20" fill="#344b60" font-weight="400">Separate results from open questions.</text>
    <path d="M525 420 H476 m8 -7 l-8 7 8 7" fill="none" stroke="#126a73" stroke-width="1.5" />
    <path d="M255 491 V535 m-7 -8 l7 8 7 -8" fill="none" stroke="#126a73" stroke-width="1.5" />
    <text x="60" y="581" font-size="19" fill="#126a73" font-weight="700" font-family="Menlo, Consolas, monospace" letter-spacing="0">5  CHECKPOINT AT THE OWNING SCOPE</text>
    <text x="80" y="632" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">CURRENT STATE</text>
    <text x="80" y="665" font-size="26" fill="#13283d" font-weight="700" font-family="Menlo, Consolas, monospace">Handoff.md</text>
    <text x="80" y="697" font-size="20" fill="#344b60" font-weight="400">Completed work, evidence and next action.</text>
    <text x="80" y="725" font-size="20" fill="#344b60" font-weight="400">Open questions and resume references.</text>
    <text x="530" y="632" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">DURABLE FACTS, ONLY IF CHANGED</text>
    <text x="530" y="665" font-size="26" fill="#13283d" font-weight="700" font-family="Menlo, Consolas, monospace">MEMORY.md</text>
    <text x="530" y="697" font-size="20" fill="#344b60" font-weight="400">Update the fact at its canonical home.</text>
    <text x="530" y="725" font-size="20" fill="#344b60" font-weight="400">Do not duplicate it into every summary.</text>
    <path d="M305 782 V818 m-7 -8 l7 8 7 -8" fill="none" stroke="#126a73" stroke-width="1.5" />
    <text x="60" y="854" font-size="17" fill="#126a73" font-weight="700" font-family="Menlo, Consolas, monospace" letter-spacing="0">6  FRESH SESSION</text>
    <text x="60" y="887" font-size="26" fill="#13283d" font-weight="700">Resume from the current handoff</text>
    <text x="60" y="919" font-size="20" fill="#344b60" font-weight="400">Read the checkpoint and verify the starting state.</text>
    <text x="60" y="947" font-size="20" fill="#344b60" font-weight="400">Continue the next action.</text>
    <text x="660" y="857" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">ARCHIVE</text>
    <text x="660" y="891" font-size="24" fill="#13283d" font-weight="700">Historical evidence</text>
    <text x="660" y="923" font-size="20" fill="#344b60" font-weight="400">Consult when needed.</text>
    <path d="M584 891 H634" fill="none" stroke="#7d8fa1" stroke-width="1.5" stroke-dasharray="6 5" />
    <text x="40" y="986" font-size="18" fill="#344b60" font-weight="400">Archived history does not replace current state. No automatic resume is claimed.</text>
    <line x1="40.0" y1="175.0" x2="470.0" y2="175.0" stroke="#13283d" stroke-width="1" />
    <line x1="530.0" y1="175.0" x2="960.0" y2="175.0" stroke="#13283d" stroke-width="1" />
    <line x1="530.0" y1="355.0" x2="960.0" y2="355.0" stroke="#13283d" stroke-width="1" />
    <line x1="40.0" y1="355.0" x2="470.0" y2="355.0" stroke="#13283d" stroke-width="1" />
    <line x1="40.0" y1="545.0" x2="960.0" y2="545.0" stroke="#13283d" stroke-width="2" />
    <line x1="40.0" y1="777.0" x2="960.0" y2="777.0" stroke="#13283d" stroke-width="1" />
    <line x1="60.0" y1="603.0" x2="470.0" y2="603.0" stroke="#126a73" stroke-width="1.5" />
    <line x1="510.0" y1="603.0" x2="940.0" y2="603.0" stroke="#126a73" stroke-width="1.5" />
    <line x1="490" y1="603.0" x2="490" y2="752.0" stroke="#b0becb" stroke-width="1" />
    <line x1="40.0" y1="825.0" x2="580.0" y2="825.0" stroke="#13283d" stroke-width="1" />
    <line x1="640.0" y1="825.0" x2="960.0" y2="825.0" stroke="#8090a1" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="640.0" y1="825.0" x2="640.0" y2="956.0" stroke="#8090a1" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="40" y1="54" x2="960" y2="54" stroke="#c8d3dd" stroke-width="1" />
  </g>
</svg>
