<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">A corrected measurement changes the poster plan</title>
  <desc id="description">Explanatory illustration of the fictional fixture. The old unconfirmed assumption was 240 cm and one row of four posters. The corrected width is 180 cm. The current plan arranges four posters in two columns and two rows, reusing boards. Memory owns the corrected constraints, the handoff says proofread captions next, and the archive marks the old assumption superseded. No installation is claimed.</desc>
