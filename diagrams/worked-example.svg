    <text x="688" y="521" font-size="18" fill="#344b60" font-weight="400">History, not current state.</text>
    <text x="54" y="601" font-size="22" fill="#344b60" font-weight="400">Fresh session: proofread captions, then prepare the installation checklist.</text>
    <text x="36" y="642" font-size="18" fill="#344b60" font-weight="400">Planning is complete; caption approval and installation are not claimed.</text>
