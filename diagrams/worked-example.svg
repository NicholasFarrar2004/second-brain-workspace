    <text x="36" y="36" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">EXPLANATORY ILLUSTRATION · FICTIONAL POSTER EXAMPLE</text>
    <text x="36" y="79" font-size="34" fill="#13283d" font-weight="400" font-family="Georgia, Times New Roman, serif">A new measurement. A different plan.</text>
    <text x="56" y="142" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">BEFORE · SUPERSEDED ASSUMPTION</text>
    <text x="56" y="177" font-size="25" fill="#13283d" font-weight="700">240 cm, not yet confirmed</text>
    <text x="56" y="207" font-size="19" fill="#344b60" font-weight="400">Earlier sketch: four posters in one row.</text>
    <text x="88" y="289" font-size="25" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">1</text>
    <text x="172" y="289" font-size="25" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">2</text>
    <text x="256" y="289" font-size="25" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">3</text>
    <text x="340" y="289" font-size="25" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">4</text>
    <text x="56" y="355" font-size="18" fill="#344b60" font-weight="400">Historical sketch, not the current layout.</text>
    <text x="594" y="142" font-size="17" fill="#126a73" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.8">AFTER · CURRENT PLAN</text>
    <text x="594" y="177" font-size="25" fill="#13283d" font-weight="700">180 cm, corrected width</text>
    <text x="594" y="207" font-size="19" fill="#344b60" font-weight="400">Four posters, two columns by two rows.</text>
    <text x="659" y="259" font-size="23" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">1</text>
    <text x="761" y="259" font-size="23" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">2</text>
    <text x="659" y="318" font-size="23" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">3</text>
    <text x="761" y="318" font-size="23" fill="#365469" font-weight="400" font-family="Menlo, Consolas, monospace">4</text>
    <text x="830" y="257" font-size="21" fill="#344b60" font-weight="400">Reuse</text>
    <text x="830" y="285" font-size="21" fill="#344b60" font-weight="400">existing</text>
    <text x="830" y="313" font-size="21" fill="#344b60" font-weight="400">boards</text>
    <text x="594" y="355" font-size="18" fill="#344b60" font-weight="400">Schematic arrangement, not to scale.</text>
